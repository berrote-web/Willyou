<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our First Date 🌹</title>

<link rel="stylesheet" href="style.css">

<style>

.card{
    background:rgba(255,255,255,.88);
    padding:35px;
    border-radius:30px;
    text-align:center;
    width:90%;
    max-width:430px;
    box-shadow:0 10px 30px rgba(255,105,180,.35);
    position:relative;
}

#noBtn{
    position:relative;
    transition:.3s;
}

</style>

</head>

<body>

<div class="card">

<img src="anime.jpg" class="anime">

<h1>🌹 One More Question 🌹</h1>

<p style="color:#d63384;font-size:18px;line-height:1.6;">
Would you like to go on a date with me?<br>
I promise it'll be full of smiles, laughter and sweet memories. ❤️
</p>

<div style="margin-top:25px;">

<button onclick="yesDate()">
💖 Yes
</button>

<button id="noBtn" onclick="moveNo()">
🤍 No
</button>

</div>

<p id="text" style="margin-top:20px;color:#d63384;font-size:20px;font-weight:bold;"></p>

</div>

<script>

let count=0;

const noMessages=[
"🥺 Please?",
"🌸 Think again...",
"💔 I'm still hoping...",
"😭 You're too fast!",
"💕 Maybe one little date?"
];

function moveNo(){

const txt=document.getElementById("text");

txt.innerHTML=noMessages[Math.min(count,noMessages.length-1)];

count++;

if(count>=3){

const btn=document.getElementById("noBtn");

btn.style.position="absolute";

btn.style.left=Math.random()*250+"px";

btn.style.top=Math.random()*250+"px";

}

}

function yesDate(){

document.body.style.opacity="0";

setTimeout(function(){

window.location.href="choose.html";

},600);

}

</script>

<script src="script.js"></script>

</body>

</html>
