<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan Our Date ❤️</title>

<link rel="stylesheet" href="style.css">

<style>
.card{
    background:rgba(255,255,255,.9);
    padding:30px;
    border-radius:25px;
    max-width:500px;
    width:90%;
    text-align:center;
    box-shadow:0 10px 30px rgba(255,105,180,.3);
}

select,input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:10px;
    border:2px solid pink;
    font-size:16px;
}

button{
    margin-top:20px;
}
</style>

</head>

<body>

<div class="card">

<img src="anime.jpg" class="anime">

<h1>❤️ Plan Our Date ❤️</h1>

<p style="color:#d63384;">
Choose what you'd like to do together.
</p>

<select id="activity">
<option>🎬 Movie</option>
<option>🍕 Lunch</option>
<option>☕ Coffee</option>
<option>🍦 Ice Cream</option>
<option>🌅 Sunset Walk</option>
<option>🎳 Bowling</option>
<option>🧺 Picnic</option>
<option>🎡 Amusement Park</option>
<option>🎮 Arcade</option>
<option>🍽️ Dinner</option>
</select>

<input type="date" id="date">

<input type="time" id="time">

<button onclick="submitDate()">
💌 Send My Answer
</button>

</div>

<script>
function submitDate(){

const activity=document.getElementById("activity").value;
const date=document.getElementById("date").value;
const time=document.getElementById("time").value;

document.body.innerHTML=`
<div class="container">

<h1 style="color:#ff1493;">💖 Yay!! 💖</h1>

<img src="anime.jpg" class="anime">

<h2 style="color:#d63384;">Preparing your surprise... 🌸</h2>

<div style="width:260px;height:20px;background:#ffd6e8;border-radius:20px;margin:30px auto;overflow:hidden;">

<div id="bar" style="height:100%;width:0%;background:#ff4fa3;"></div>

</div>

</div>
`;

let progress=0;

let loading=setInterval(function(){

progress+=2;

document.getElementById("bar").style.width=progress+"%";

if(progress>=100){

clearInterval(loading);

document.body.innerHTML=`

<div class="container">

<img src="anime.jpg" class="anime">

<h1 style="color:#ff1493;">💌 One Last Thing...</h1>

<div style="background:white;padding:25px;border-radius:20px;max-width:450px;margin:auto;box-shadow:0 10px 25px rgba(0,0,0,.15);">

<p style="color:#d63384;font-size:20px;line-height:1.8;">

Dear You ❤️<br><br>

Thank you for giving this little website a chance.

It may just be a simple webpage, but every line was made with a smile.

I'm really looking forward to spending time with you.

No matter where we go...

Movie 🍿

Coffee ☕

Lunch 🍕

Or just a walk together...

I know it'll be special because you'll be there.

🌸 Thank you for saying YES.

</p>

<button onclick="sendWhatsApp()">

💚 Continue to WhatsApp

</button>

</div>

</div>
`;

window.activity=activity;
window.date=date;
window.time=time;

}

},40);

}

function sendWhatsApp(){

const message=`💖 Hey!

I accepted your invitation ❤️

🎬 Activity: ${window.activity}

📅 Date: ${window.date}

🕒 Time: ${window.time}

I'm looking forward to our date 🌸`;

window.location.href="https://wa.me/918590660839?text="+encodeURIComponent(message);

}
</script>

</body>
</html>
