<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Will You Be Mine? 💖</title>

<link rel="stylesheet" href="style.css">

<style>

.card{
    background:rgba(255,255,255,.85);
    padding:30px;
    border-radius:25px;
    box-shadow:0 10px 30px rgba(255,105,180,.4);
    text-align:center;
    width:90%;
    max-width:420px;
}

.buttons{
    margin-top:20px;
}

#reply{
    margin-top:20px;
    color:#d63384;
    font-size:22px;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="card">

<img src="anime.jpg" id="girl" class="anime">

<h1>💖 Will You Be Mine? 💖</h1>

<p style="color:#d63384;font-size:18px;">
Every heartbeat whispers your name... 🌸
</p>

<div class="buttons">

<button id="yesBtn" onclick="yesAnswer()">
💗 Yes
</button>

<button id="noBtn" onclick="noAnswer()">
🤍 No
</button>

</div>

<p id="reply"></p>

</div>

<script>

let noCount=0;

const messages=[
"🥺 Really...?",
"💔 Are you sure?",
"😭 You're making me cry...",
"🌸 Please think again...",
"💕 I'll do my best to make you smile...",
"🥹 Last chance...?"
];

function noAnswer(){

let reply=document.getElementById("reply");

reply.innerHTML=messages[Math.min(noCount,messages.length-1)];

let girl=document.getElementById("girl");

girl.style.filter="grayscale(40%)";
girl.style.opacity=".85";

let yes=document.getElementById("yesBtn");

yes.style.transform=`scale(${1+(noCount*0.15)})`;

noCount++;

}

function yesAnswer(){

document.body.style.opacity="0";

setTimeout(function(){

window.location.href="date.html";

},600);

}

</script>

<script src="script.js"></script>

</body>
</html>
