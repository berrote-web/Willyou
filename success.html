<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Story ❤️</title>

<link rel="stylesheet" href="style.css">

<style>

.card{

background:rgba(255,255,255,.88);

padding:35px;

border-radius:30px;

width:90%;

max-width:500px;

text-align:center;

box-shadow:0 10px 30px rgba(255,105,180,.35);

}

.info{

margin-top:20px;

font-size:20px;

color:#d63384;

line-height:1.8;

}

.love{

font-size:60px;

animation:beat 1s infinite;

}

@keyframes beat{

50%{

transform:scale(1.2);

}

}

</style>

</head>

<body>

<div class="card">

<div class="love">💖</div>

<h1>She Said YES!! 🌸</h1>

<p class="info">

🎬 <span id="activity"></span>

<br><br>

📅 <span id="date"></span>

<br><br>

🕒 <span id="time"></span>

</p>

<h2 style="color:#ff1493;">

I can't wait for our date ❤️

</h2>

<p style="margin-top:20px;color:#d63384;">

Thank you for making my day.

I'll be counting every second until we meet. 🌹

</p>

<button onclick="finish()">

💌 Finish

</button>

</div>

<script>

document.getElementById("activity").innerHTML=

localStorage.getItem("activity");

document.getElementById("date").innerHTML=

localStorage.getItem("date");

document.getElementById("time").innerHTML=

localStorage.getItem("time");

function finish(){

alert("❤️ Thank you for visiting my little website ❤️");

}

</script>

</body>

</html>
